[project]
authors = [
  {name = "Hassan Umari", email = "oh91@windowslive.com"},
]
dependencies = [
  "numpy>=1.20.0",
  "matplotlib>=3.5.0",
  "toppra==0.6.3",
]
description = "Retiming of UR30 joint-space trajectories under Cartesian speed, joint velocity and joint acceleration limits"
name = "trajectory_retiming"
readme = "README.md"
requires-python = ">=3.14"
version = "0.1.0"

[project.scripts]
trajectory-retiming = "trajectory_retiming.retimer:main"

[build-system]
build-backend = "uv_build"
requires = ["uv_build>=0.12.5,<0.13.0"]

[dependency-groups]
dev = [
  "ipython>=8.0.0",
  "pytest>=7.0.0",
  "pytest-cov>=4.0.0",
]

[tool.pytest.ini_options]
testpaths = ["test"]
